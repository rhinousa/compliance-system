// Sheets deleteDimension needs the tab's numeric sheetId (not its name) — fetched once and cached.
async function pmmGetSheetGid(){
  if(pmmSheetGidCache!==null) return pmmSheetGidCache;
  const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}?fields=sheets.properties`,{headers:{Authorization:"Bearer "+accessToken}});
  if(!res.ok) throw new Error("Could not look up the sheet tab info.");
  const data=await res.json();
  const sheet=(data.sheets||[]).find(s=>s.properties.title===PMM_SHEET);
  if(!sheet) throw new Error(`Could not find a tab named "${PMM_SHEET}".`);
  pmmSheetGidCache=sheet.properties.sheetId;
  return pmmSheetGidCache;
}

// Parses a Sheets API updatedRange like "'Product Matrix'!A15:L16" into [15,16].
function pmmParseRowRange(rangeStr){
  const m=String(rangeStr||"").match(/![A-Z]+(\d+):[A-Z]+(\d+)/);
  if(!m) return [];
  const start=parseInt(m[1]), end=parseInt(m[2]);
  const out=[]; for(let r=start;r<=end;r++) out.push(r);
  return out;
}

// These just update the in-memory entry as the user types — nothing is written to

async function pmmSaveEntryDetail(entryId){
  const e=pmmEntries.find(x=>x.id===entryId);
  if(!e) return;
  if(!accessToken){ alert('Please "Connect & Sync" with Google first.'); return; }
  const btn=document.getElementById("pmm-detail-save-btn");
  if(btn){ btn.disabled=true; btn.textContent="Saving…"; }
  try{
    // Simplest reliable way to persist an edit across a variable number of component
    // rows: remove the entry's old rows entirely, then re-append fresh ones with the
    // same Entry ID so it stays the same logical entry, just with updated content.
    if(e.rowIndexes && e.rowIndexes.length){
      const gid=await pmmGetSheetGid();
      const rowsDesc=[...e.rowIndexes].sort((a,b)=>b-a);
      const requests=rowsDesc.map(r=>({deleteDimension:{range:{sheetId:gid,dimension:"ROWS",startIndex:r-1,endIndex:r}}}));
      const delRes=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}:batchUpdate`,{
        method:"POST",
        headers:{Authorization:"Bearer "+accessToken,"Content-Type":"application/json"},
        body:JSON.stringify({requests}),
      });
      if(!delRes.ok){ const t=await delRes.text(); throw new Error(`Sheet update failed (${delRes.status}): ${t.slice(0,150)}`); }
    }
    const components=e.components.filter(c=>c.item||c.component||c.material);
    const rows=components.map(c=>[e.sku,e.description,e.category,e.supplier,e.chemCost,e.tier,e.id,e.photoUrl,c.item,c.component,c.material,e.parentSku,
      e.skuFamily,e.skuFamilyB,e.skuFamilyC,e.chemTest,e.chemTestCost,e.chemTestSample,e.physTest,e.physTestCost,e.physTestSample,e.corrTest,e.corrTestCost,e.corrTestSample,e.testLab,e.quotationDate,e.retailSku]);
    await pmmEnsureHeaders();
    const appendRes=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(PMM_SHEET)}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,{
      method:"POST",
      headers:{Authorization:"Bearer "+accessToken,"Content-Type":"application/json"},
      body:JSON.stringify({values:rows}),
    });
    if(!appendRes.ok){ const t=await appendRes.text(); throw new Error(`Sheet update failed (${appendRes.status}): ${t.slice(0,150)}`); }
    closeModal();
    await fetchSheetData(); // refresh row indices for this and every other entry
  }catch(err){
    alert("Could not save changes: "+err.message);
    if(btn){ btn.disabled=false; btn.textContent="💾 Save Changes"; }
  }
}

async function pmmDeleteEntry(entryId){
  const entry=pmmEntries.find(e=>e.id===entryId);
  if(!entry) return;
  if(!confirm(`Delete "${entry.sku||"this entry"}"? This removes it from the Google Sheet permanently.`)) return;
  if(!accessToken){ alert('Please "Connect & Sync" with Google first.'); return; }

  try{
    if(entry.rowIndexes && entry.rowIndexes.length){
      const gid=await pmmGetSheetGid();
      const rowsDesc=[...entry.rowIndexes].sort((a,b)=>b-a); // delete bottom-up so earlier deletes don't shift later ones
      const requests=rowsDesc.map(r=>({deleteDimension:{range:{sheetId:gid,dimension:"ROWS",startIndex:r-1,endIndex:r}}}));
      const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}:batchUpdate`,{
        method:"POST",
        headers:{Authorization:"Bearer "+accessToken,"Content-Type":"application/json"},
        body:JSON.stringify({requests}),
      });
      if(!res.ok){ const t=await res.text(); throw new Error(`Sheet delete failed (${res.status}): ${t.slice(0,150)}`); }
    } else {
      // No known row numbers (e.g. very old cached entry) — remove locally only.
      pmmEntries=pmmEntries.filter(e=>e.id!==entryId);
      localStorage.setItem("rhino_pmm_entries_v1",JSON.stringify(pmmEntries));
      pmmRender();
      return;
    }
    // Deleting rows shifts every other entry's row numbers, so re-sync to refresh them all correctly.
    await fetchSheetData();
  }catch(e){
    alert("Could not delete: "+e.message);
  }
}

// ── Compiled View ─────────────────────────────────────────────────────────
// Greedy "set cover": repeatedly picks the product covering the most still-uncovered
// materials, until every unique material across all entries is covered by at least
// one selected representative product. Minimizes how many products need physical
// testing samples while still covering every distinct material at least once.
function pmmComputeSetCover(entries){
  entries=entries||pmmEntries;
  const materialDisplay={}; // lowercase key -> original-case display text (first seen)
  const materialOccurrences={}; // lowercase key -> count of entries containing it
  const productMaterials={}; // entryId -> Set of lowercase material keys

  entries.forEach(e=>{
    const matSet=new Set();
    e.components.forEach(c=>{
      const key=(c.material||"").trim().toLowerCase();
      if(!key) return;
      matSet.add(key);
      if(!materialDisplay[key]) materialDisplay[key]=c.material.trim();
    });
    productMaterials[e.id]=matSet;
    matSet.forEach(key=>{ materialOccurrences[key]=(materialOccurrences[key]||0)+1; });
  });

  const allMaterials=new Set(Object.keys(materialDisplay));
  const uncovered=new Set(allMaterials);
  const selected=[]; // [{entry, newlyCovered:[keys]}]
  const usedIds=new Set();

  while(uncovered.size>0){
    let best=null, bestCovered=null, bestCount=-1;
    entries.forEach(e=>{
      if(usedIds.has(e.id)) return;
      const matSet=productMaterials[e.id];
      if(!matSet||!matSet.size) return;
      const covered=[...matSet].filter(k=>uncovered.has(k));
      if(covered.length>bestCount){ bestCount=covered.length; best=e; bestCovered=covered; }
    });
    if(!best||bestCount<=0) break; // no product covers any remaining material — stop to avoid an infinite loop
    selected.push({entry:best,newlyCovered:bestCovered});
    usedIds.add(best.id);
    bestCovered.forEach(k=>uncovered.delete(k));
  }

  return {materialDisplay, materialOccurrences, allMaterials, selected, uncoveredLeftover:uncovered, productMaterials};
}

// Strips brand, color, pack size, dimensions, and tier info from a product
// description down to a generic family name (e.g. "Rhino USA Retractable Ratchet
// Straps (4PK 1INX10FT) (Green)" → "Retractable Ratchet Straps"). Heuristic, not
// exact — intended to make groupings and insight text more readable, not to be
// a canonical product taxonomy.
const PMM_COLOR_WORDS=["black","green","blue","red","orange","gray","grey","yellow","purple","pink","white","tan","camo","silver","gold","brown","navy","maroon"];
function pmmNormalizeProductName(desc){
  if(!desc) return "";
  // No leading \b: retail-channel descriptions sometimes write dimensions as
  // "2x1INX10FT" (a quantity multiplier glued directly onto the size) -- a leading
  // word-boundary requirement would fail to match "1INX10FT" in that string at all.
  const dimRe=/\d+(\/\d+)?(\.\d+)?\s*in\s*x\s*\d+(\/\d+)?(\.\d+)?\s*ft\b/gi;
  const dims=[];
  let dm;
  while((dm=dimRe.exec(desc))!==null){ dims.push(dm[0].replace(/\s+/g,"").toUpperCase()); } // canonical form -- "2IN X 10FT" and "2inx10ft" must match "2INX10FT"

  let s=desc;
  s=s.replace(/\([^)]*\)/g," ");           // (4PK 1INX10FT), (Green), etc.
  s=s.replace(/\[[^\]]*\]/g," ");
  s=s.replace(/\brhino\s*usa\b/gi," ");    // brand
  s=s.replace(dimRe," ");                  // remove raw dimension text from the base -- we re-add a cleaned copy below
  s=s.replace(/\b\d+\/\d+\s*$/,"");        // leftover trailing fraction fragment if a dimension partially matched
  s=s.replace(/\b\d+\s*-?\s*(pk|pack|pcs?|ct|count)\b/gi," ");      // 4PK, 8-Pack, 2 PCS
  s=s.replace(/\btier\s*\d+\b/gi," ");     // Tier 1, Tier 2
  // Retail-channel names often appear as plain trailing text (not in parens), e.g.
  // "... Walmart-Retail" or "... - 6 set in Pack" -- strip those too, since a product
  // sold through a specific retailer is still the same underlying product family.
  s=s.replace(/\b(walmart|costco|autozone|sam'?s|target|lowe'?s|pdq)\b/gi," ");
  s=s.replace(/\bretail\b/gi," ");
  s=s.replace(/-\s*\d+\s*set\s*in\s*p[a-z]*\b.*/gi," ");
  const colorRe=new RegExp("\\b("+PMM_COLOR_WORDS.join("|")+")\\b","gi");
  s=s.replace(colorRe," ");
  s=s.replace(/\s{2,}/g," ").trim();
  s=s.replace(/^[-–—,:\s]+|[-–—,:\s]+$/g,"");

  const base=s || desc.trim();
  // Retain the size/dimension -- two products with the same base name but different
  // sizes are genuinely different products and must not be grouped as siblings.
  return dims.length ? `${base} ${dims[0]}`.trim() : base;
}

// For each representative product, count how many OTHER products' entire material
// set is already fully contained within it -- those products don't need their own
// separate testing sample, since the representative's results already cover them.
function pmmComputeRepresentedCounts(selected, productMaterials, entries){
  entries=entries||pmmEntries;
  const assigned={};
  entries.forEach(e=>{
    const pset=productMaterials[e.id];
    if(!pset||!pset.size) return;
    for(const sel of selected){
      const rset=productMaterials[sel.entry.id];
      let isSubset=true;
      for(const m of pset){ if(!rset.has(m)){ isSubset=false; break; } }
      if(isSubset){ assigned[e.id]=sel.entry.id; break; }
    }
  });
  const counts={};
  Object.values(assigned).forEach(repId=>{ counts[repId]=(counts[repId]||0)+1; });
  return counts;
}

function pmmUniqueMaterialCombinationsCount(entries){
  entries=entries||pmmEntries;
  const sigs=new Set();
  entries.forEach(e=>{
    const keys=[...new Set(e.components.map(c=>(c.material||"").trim().toLowerCase()).filter(Boolean))].sort();
    if(keys.length) sigs.add(keys.join("|"));
  });
  return sigs.size;
}

// -- Real cost/sample math, built from what's actually captured in Testing
// Information per entry, instead of a flat assumed per-SKU rate. --
function pmmParseNum(v){
  const n=parseFloat(String(v||"").replace(/[^0-9.]/g,""));
  return isNaN(n)?0:n;
}
function pmmEntryTestingCost(e){
  return pmmParseNum(e.chemTestCost)+pmmParseNum(e.physTestCost)+pmmParseNum(e.corrTestCost);
}
function pmmEntryTestingSamples(e){
  return pmmParseNum(e.chemTestSample)+pmmParseNum(e.physTestSample)+pmmParseNum(e.corrTestSample);
}

// Restricts the entry set to Quotation Date's range when one is set (dates are plain
// "YYYY-MM-DD" strings from the date inputs, so lexicographic comparison is correct).
function pmmGetInsightEntries(){
  let entries=pmmEntries;
  if(pmmInsightDateFrom||pmmInsightDateTo){
    entries=entries.filter(e=>{
      if(!e.quotationDate) return false;
      if(pmmInsightDateFrom && e.quotationDate<pmmInsightDateFrom) return false;
      if(pmmInsightDateTo && e.quotationDate>pmmInsightDateTo) return false;
      return true;
    });
  }
  return entries;
}

// Lightweight edit gate -- not real security, just a soft deterrent against
// accidental/casual edits. Anyone with the password can still edit.
// Lightweight edit gate -- not real security (this all runs in the browser, so a
// determined person could always find and reverse a weak hash, or just read the
// comparison logic in dev tools). Hashing at least means the plaintext password
// itself isn't sitting in readable page source for a casual look.
const PMM_EDIT_PASSWORD_HASH="fff9dfeaa22b620f2857f6423e7bb1da427f14c3f3a0adcb534f05f2adccfad3";
async function pmmHashText(text){
  const enc=new TextEncoder().encode(text);
  const digest=await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function pmmRequestEdit(entryId){
  openModal({type:"pmmEditGate", entryId});
  setTimeout(()=>document.getElementById("pmm-editgate-input")?.focus(), 50);
}
async function pmmConfirmEditGate(entryId){
  const input=document.getElementById("pmm-editgate-input");
  const errEl=document.getElementById("pmm-editgate-error");
  const pwd=(input?.value||"");
  if(!pwd){ if(errEl) errEl.textContent="Please enter a password."; return; }
  const hash=await pmmHashText(pwd);
  if(hash!==PMM_EDIT_PASSWORD_HASH){
    if(errEl) errEl.textContent="Incorrect password.";
    if(input){ input.value=""; input.focus(); }
    return;
  }
  closeModal();
  pmmOpenEntryDetail(entryId);
}

            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.description)}</td>

            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.supplier)}</td>
            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.tier)}</td>
            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.parentSku)}</td>
            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.chemTest)}</td>
            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.chemTestCost)}</td>
            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.chemTestSample)}</td>
            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.physTest)}</td>
            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.physTestCost)}</td>
            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.physTestSample)}</td>
            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.corrTest)}</td>
            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.corrTestCost)}</td>
            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.corrTestSample)}</td>

            <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(e.quotationDate)}</td>
          `:`<td colspan="22" style="border-right:1px dashed #eee"></td>`}
          <td style="padding:7px 12px;color:#555;white-space:nowrap">${esc(c.item)}</td>
          <td style="padding:7px 12px;color:#333;white-space:nowrap">${esc(c.component)}</td>
          <td style="padding:7px 12px;font-weight:600;background:${col.bg};color:${col.text};white-space:nowrap">${c.material?`<span class="pmm-mat-swatch" style="background:${col.text}"></span>${esc(c.material)}`:""}</td>
        </tr>`;
      });
    });
    html+=`</tbody></table></div>
      <div style="font-size:10px;color:#aaa;margin-top:6px">Click any SKU cell to open the full editable detail view.</div>
      <div style="font-size:10px;color:#aaa;margin-top:2px">${entries.length} product${entries.length!==1?"s":""} · ${entries.reduce((a,e)=>a+e.components.length,0)} component rows · synced from the "Product Matrix" tab</div>`;
  }
  html+=`</div>`;
  body.innerHTML=html;
}

function pmmRenderCompiled(){
  const body=document.getElementById("pmm-body"); if(!body) return;
  let entries=pmmEntries.slice();
  if(pmmFilterCategory!=="ALL") entries=entries.filter(e=>e.category===pmmFilterCategory);
  if(pmmSearchSku){
    const q=pmmSearchSku.toLowerCase();
    entries=entries.filter(e=>(e.sku||"").toLowerCase().includes(q));
  }
  pmmEntries.forEach(e=>e.components.forEach(c=>pmmMaterialColor(c.material))); // stable first-seen color order

  let html=`<div style="max-width:100%;margin:0 auto">`;
  html+=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center">
    <div style="flex:1;min-width:200px;max-width:320px">
      <input value="${esc(pmmSearchSku)}" oninput="pmmSearchSku=this.value;pmmRenderCompiled()" placeholder="Search SKU…" class="pmm-input"/>
    </div>
    <select onchange="pmmFilterCategory=this.value;pmmRenderCompiled()" class="pmm-input" style="max-width:200px">
      <option value="ALL" ${pmmFilterCategory==="ALL"?"selected":""}>All Categories</option>
      ${PMM_CATEGORIES.map(c=>`<option value="${c}" ${pmmFilterCategory===c?"selected":""}>${c}</option>`).join("")}
    </select>
  </div>`;

  if(!pmmEntries.length){
    html+=`<div style="text-align:center;padding:60px;color:#aaa"><div style="font-size:32px;margin-bottom:8px">🧩</div><div style="font-size:12px">No entries yet — submit one from the "New Entry" tab.</div></div>`;
  } else {
    html+=pmmInsightsHtml();
    if(!entries.length){
      html+=`<div style="text-align:center;padding:40px;color:#aaa"><div style="font-size:12px">No entries match the current filter/search.</div></div>`;
    } else {
      html+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;align-items:start;margin-top:14px">`;
      entries.forEach(e=>{ html+=pmmEntryCardHtml(e); });
      html+=`</div>`;
    }
  }
  html+=`</div>`;
  body.innerHTML=html;
}
</script>
</body>
</html>
