<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Compliance Dashboard — Rhino USA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.spin{animation:spin .8s linear infinite;display:inline-block;width:13px;height:13px;border:2px solid #c7dcf8;border-top-color:#0073ea;border-radius:50%;vertical-align:middle;flex-shrink:0}

/* Toolbar */
.toolbar-group{display:flex;align-items:center;border:1.5px solid #c8cdd7;border-radius:8px;overflow:visible;background:#fff;flex-shrink:0}
.tb{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;font-size:12px;font-weight:500;color:#444;background:#fff;border:none;border-right:1px solid #dde0e7;cursor:pointer;position:relative;white-space:nowrap;transition:all .15s;height:34px;line-height:1}
.tb:last-child{border-right:none}.tb:first-child{border-radius:6px 0 0 6px}.tb:last-child{border-radius:0 6px 6px 0}.tb:only-child{border-radius:6px}
.tb svg{flex-shrink:0;opacity:.65}.tb:hover{background:#f0f6ff;color:#0073ea}.tb:hover svg{opacity:1}.tb.on{background:#e8f2ff;color:#0073ea;font-weight:600}.tb.on svg{opacity:1}
.dp{position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1.5px solid #dde0e7;border-radius:10px;box-shadow:0 10px 32px rgba(0,0,0,.14);z-index:99;min-width:220px;padding:6px 0;animation:fadeDown .14s ease}
.dpi{padding:8px 16px;font-size:12px;color:#333;cursor:pointer;display:flex;align-items:center;gap:8px}.dpi:hover{background:#f0f6ff;color:#0073ea}.dpi.sel{color:#0073ea;font-weight:600}
.dps{height:1px;background:#eee;margin:4px 0}.dpl{padding:7px 16px 3px;font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.7px}
.ir{cursor:pointer}.ir:hover{background:#f0f6ff!important}.sr{cursor:pointer}.sr:hover{background:#eef1ff!important}.gh:hover{background:#eaecf2!important}
.comp-cell{transition:background .12s}.comp-cell:hover{background:#e8f4ff!important}
.rpt{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#0073ea;padding:3px 8px;border-radius:4px;background:#e8f2ff;border:1px solid #c0d8f8;text-decoration:none;margin-top:4px}.rpt:hover{background:#d0e6ff}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal-box{background:#fff;border-radius:12px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 16px 48px rgba(0,0,0,.22);animation:fadeDown .18s ease}
.kpi-card{background:#fff;border:1.5px solid #e8eaed;border-radius:10px;padding:14px 18px;flex:1;min-width:140px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-pass::before{background:#00c875}.kpi-fail::before{background:#e2445c}.kpi-pending::before{background:#fdab3d}.kpi-total::before{background:#0073ea}
/* pills */
.cs-pill{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:12px;white-space:nowrap}
.cs-yes{background:#e3f9ee;color:#0a7a46;border:1px solid #c3f0da}
.cs-no{background:#f7f8fa;color:#aaa;border:1px solid #e0e0e0}
/* priority badges */
.p1b{background:#fff0f5;color:#c0125a;border:1px solid #ffc0d9;font-size:9px;padding:1px 6px;border-radius:20px;font-weight:700;white-space:nowrap;display:inline-block}
.p2b{background:#fff8e0;color:#b07000;border:1px solid #fde8c0;font-size:9px;padding:1px 6px;border-radius:20px;font-weight:700;white-space:nowrap;display:inline-block}
.p3b{background:#f0efff;color:#5b21b6;border:1px solid #d8d0f8;font-size:9px;padding:1px 6px;border-radius:20px;font-weight:700;white-space:nowrap;display:inline-block}
.p4b{background:#f7f8fa;color:#666;border:1px solid #e0e0e0;font-size:9px;padding:1px 6px;border-radius:20px;font-weight:700;white-space:nowrap;display:inline-block}
/* monitoring */
.mon-ok{color:#0a7a46;font-weight:700}.mon-soon{color:#b07000;font-weight:700}.mon-over{color:#c0392b;font-weight:700;animation:pulse 2s infinite}.mon-none{color:#aaa}
/* banners */
.refresh-banner{background:#fff;border:1.5px solid #e0e3ea;border-radius:12px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.refresh-banner.ready{border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.04)}
.refresh-banner.stale{border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.07)}
.refresh-banner.loading{border-color:rgba(0,115,234,.35);background:rgba(0,115,234,.04)}
.refresh-banner.done{border-color:rgba(0,200,117,.45);background:rgba(0,200,117,.05)}
.refresh-banner.error{border-color:rgba(226,68,92,.4);background:rgba(226,68,92,.05)}
.refresh-info{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.refresh-title{font-size:13px;font-weight:600;color:#222}.refresh-sub{font-size:11px;color:#888}
.refresh-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;font-size:12px;font-weight:600;border-radius:7px;border:none;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.refresh-btn.idle{background:#0073ea;color:#fff}.refresh-btn.idle:hover{background:#005cc8}
.refresh-btn.loading{background:#e8f2ff;color:#0073ea;cursor:not-allowed;border:1px solid #c0d8f8}
.refresh-btn.done{background:#e3f9ee;color:#0a7a46;cursor:pointer;border:1px solid #c3f0da}.refresh-btn.done:hover{background:#d0f5e0}
.refresh-btn.error{background:#ffe8e8;color:#c0392b;cursor:pointer;border:1px solid #ffd5d5}
.field-input{width:100%;padding:9px 12px;border:1.5px solid #c8cdd7;border-radius:7px;font-size:12px;color:#333;font-family:monospace;margin-top:5px;margin-bottom:12px}
.field-input:focus{outline:none;border-color:#0073ea;box-shadow:0 0 0 3px rgba(0,115,234,.1)}
.info-box{background:#f0f6ff;border:1px solid #c0d8f8;border-radius:7px;padding:10px 13px;font-size:11px;color:#0055bb;line-height:1.6;margin-bottom:12px}
.warn-box{background:#fff8e0;border:1px solid #fde8c0;border-radius:7px;padding:10px 13px;font-size:11px;color:#7a5500;line-height:1.6;margin-bottom:14px}
.sync-cta{display:inline-flex;align-items:center;gap:8px;background:#0073ea;color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer}.sync-cta:hover{background:#005cc8}
.tab-btn{padding:8px 16px;font-size:12px;background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.65);font-weight:500;cursor:pointer;white-space:nowrap}
.tab-btn.active{border-bottom-color:#fff;color:#fff;font-weight:700}
/* search — kept out of innerHTML cycle so typing is uninterrupted */
#search-wrap{position:relative;flex:1;min-width:160px;max-width:280px}
#search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#aaa;pointer-events:none}
#searchBox{width:100%;padding:6px 10px 6px 30px;border:1.5px solid #dde0e7;border-radius:7px;font-size:12px;background:#fafbfc;color:#333;outline:none;height:34px}
#searchBox:focus{border-color:#0073ea}

/* ── App shell / sidebar ─────────────────────────────────────────────── */
#app-shell{display:flex;min-height:100vh}
#app-sidebar{width:230px;flex-shrink:0;background:#0e1b3d;padding:22px 14px;display:flex;flex-direction:column;gap:6px}
#app-sidebar .brand{color:#fff;font-size:14px;font-weight:800;padding:0 8px 18px 8px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;line-height:1.35}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;color:rgba(255,255,255,.72);font-size:13px;font-weight:600;padding:11px 12px;border-radius:8px;cursor:pointer;transition:background .12s,color .12s}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.active{background:#0073ea;color:#fff}
#app-main{flex:1;min-width:0}
.app-panel{display:none}
.app-panel.active{display:block}

/* ── Product Material Matrix ────────────────────────────────────────── */
.pmm-subtab{padding:8px 16px;font-size:12px;background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.65);font-weight:500;cursor:pointer;white-space:nowrap}
.pmm-subtab.active{border-bottom-color:#fff;color:#fff;font-weight:700}
.pmm-card{background:#fff;border:1.5px solid #e0e3ea;border-radius:12px;padding:20px 22px;margin-bottom:16px}
.pmm-label{font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;display:block}
.pmm-input{width:100%;padding:9px 12px;border:1.5px solid #c8cdd7;border-radius:7px;font-size:12.5px;color:#333;outline:none}
.pmm-input:focus{border-color:#0073ea;box-shadow:0 0 0 3px rgba(0,115,234,.1)}
textarea.pmm-input{resize:vertical;min-height:52px;font-family:inherit}
.pmm-field{margin-bottom:16px}
.pmm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pmm-comp-table{width:100%;border-collapse:collapse;font-size:12px}
.pmm-comp-table th{text-align:left;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;border-bottom:1.5px solid #e8eaed}
.pmm-comp-table td{padding:4px 6px;border-bottom:1px solid #f0f1f3}
.pmm-comp-table input{width:100%;padding:6px 8px;border:1px solid #dde0e7;border-radius:5px;font-size:11.5px;outline:none}
.pmm-comp-table input:focus{border-color:#0073ea}
.pmm-photo-drop{border:2px dashed #c8cdd7;border-radius:10px;padding:22px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.pmm-photo-drop:hover{border-color:#0073ea;background:#f7fbff}
.pmm-photo-preview{max-width:100%;max-height:220px;border-radius:8px;display:block;margin:0 auto}
.pmm-entry-card{background:#fff;border:1.5px solid #e0e3ea;border-radius:12px;overflow:hidden}
.pmm-entry-hdr{padding:14px 20px;background:#f8f9fb;border-bottom:1px solid #e8eaed;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.pmm-cat-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;background:#e8f2ff;color:#0055bb;border:1px solid #c0d8f8}
.pmm-tier-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;background:#f0efff;color:#5b21b6;border:1px solid #d8d0f8}
.pmm-mat-swatch{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;flex-shrink:0;vertical-align:middle}
.pmm-zoom-lens{position:absolute;border:2px solid #0073ea;width:90px;height:90px;cursor:zoom-in;pointer-events:none;background:rgba(0,115,234,.08);display:none}
.pmm-zoom-result{position:fixed;width:320px;height:320px;border:1.5px solid #dde0e7;border-radius:10px;background-repeat:no-repeat;background-color:#fff;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:600;display:none}
.pmm-insight-box{background:#f0f6ff;border:1.5px solid #c0d8f8;border-radius:10px;padding:16px 20px;margin-bottom:18px}
</style>
</head>

<div class="app-panel active" id="panel-compliance">
<div style="max-width:1400px;margin:0 auto;padding:0 20px 40px 20px">

  <!-- Header (static) -->
  <div style="background:#0e1b3d">
    <div style="padding:12px 18px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:20px">📋</span>
        <span style="color:#fff;font-weight:700;font-size:15px" id="hdr-name">Compliance Dashboard</span>
        <span style="color:rgba(255,255,255,.5);font-size:11px" id="hdr-sub">Rhino USA</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div id="hdr-acctBtn" style="display:none;align-items:center;gap:6px;color:rgba(255,255,255,.6);font-size:11px">
          <span style="width:7px;height:7px;border-radius:50%;background:#00c875;display:inline-block;flex-shrink:0"></span>Signed in with Google
        </div>
      </div>
    </div>
    <div style="display:flex;margin-top:10px;padding:0 10px;border-top:1px solid rgba(255,255,255,.2)">
      <button class="tab-btn active" id="tab-table" onclick="switchTab('table')">Main Table</button>
      <button class="tab-btn" id="tab-monitoring" onclick="switchTab('monitoring')">Monitoring <span id="mon-badge" style="display:none;background:#e2445c;color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:3px"></span></button>
      <button class="tab-btn" id="tab-expense" onclick="switchTab('expense')">💰 Test Expense</button>
    </div>
  </div>

  <!-- Sync banner (dynamic) -->
  <div id="sync-banner-wrap" style="padding:10px 18px;background:#fafbfc;border-bottom:1px solid #e8eaed">
    <div class="refresh-banner ready" id="banner">
      <div class="refresh-info">
        <div class="refresh-title" id="banner-title">Not connected</div>
        <div class="refresh-sub" id="banner-sub">Connect your Google Sheet to load live data</div>
        <div id="banner-progress" style="display:none;width:100%;height:3px;background:#e0e3ea;border-radius:2px;margin-top:8px;overflow:hidden"><div id="banner-bar" style="height:100%;background:#0073ea;border-radius:2px;width:0%;transition:width .4s ease"></div></div>
      </div>
      <button class="refresh-btn idle" id="syncBtn" onclick="triggerSync()">🔗 Connect &amp; Sync</button>
    </div>
  </div>

  <!-- KPI (dynamic) -->
  <div id="kpi-section"></div>

  <!-- Toolbar (dynamic — only the filter/sort parts; search is static) -->
  <!-- Toolbar: search + inline filter pills + sort -->
  <div id="toolbar-wrap" style="display:none;background:#fff;border-left:0.5px solid #dde0e7;border-right:0.5px solid #dde0e7;border-bottom:1px solid #e8eaed;padding:10px 18px 8px;flex-direction:column;gap:0">
    <!-- Row 1: Search + SKU + Sort + Clear -->
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <div id="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchBox" placeholder="Search products &amp; tests…" autocomplete="off" spellcheck="false" oninput="onSearch(this.value)"/>
      </div>
      <div style="position:relative;flex-shrink:0">
        <select id="skuSelect" onchange="onSkuSelect(this.value)" style="padding:6px 28px 6px 10px;border:1.5px solid #dde0e7;border-radius:7px;font-size:12px;background:#fafbfc;color:#333;outline:none;height:34px;cursor:pointer;appearance:none;min-width:140px;max-width:200px">
          <option value="">All SKUs</option>
        </select>
        <svg style="position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:#888" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div style="position:relative">
        <button class="tb" id="btn-sort" onclick="tDD('sort')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="9" y1="18" x2="15" y2="18"/></svg>
          <span>Sort</span><span id="sort-badge" style="display:none;background:#0073ea;color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700">1</span>
        </button>
        <div class="dp" id="dp-sort" style="display:none"></div>
      </div>
      <button id="clear-all-filters" onclick="clearAllFilters()" style="display:none;font-size:11px;color:#e2445c;background:none;border:1px solid #ffd5d5;cursor:pointer;font-weight:600;padding:4px 10px;border-radius:6px">&#10005; Clear all</button>
    </div>
    <!-- Filter rows -->
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:4px">
      <!-- Country: pills (as-is) -->
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0">Country</span>
        <div id="fp-country" style="display:flex;gap:4px;flex-wrap:nowrap"></div>
      </div>
      <!-- Group: compact select -->
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0">Group</span>
        <div style="position:relative">
          <select id="fp-group-sel" onchange="setFG(this.value)" style="padding:4px 28px 4px 10px;border:1.5px solid #dde0e7;border-radius:20px;font-size:11px;font-weight:600;background:#fff;color:#333;outline:none;height:30px;cursor:pointer;appearance:none;min-width:140px"></select>
          <svg style="position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:#888" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <!-- Priority: compact select -->
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0">Priority</span>
        <div style="position:relative">
          <select id="fp-priority-sel" onchange="setFP(this.value)" style="padding:4px 28px 4px 10px;border:1.5px solid #dde0e7;border-radius:20px;font-size:11px;font-weight:600;background:#fff;color:#333;outline:none;height:30px;cursor:pointer;appearance:none;min-width:110px"></select>
          <svg style="position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:#888" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <!-- Result: compact select -->
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0">Result</span>
        <div style="position:relative">
          <select id="fp-result-sel" onchange="setFR(this.value)" style="padding:4px 28px 4px 10px;border:1.5px solid #dde0e7;border-radius:20px;font-size:11px;font-weight:600;background:#fff;color:#333;outline:none;height:30px;cursor:pointer;appearance:none;min-width:100px"></select>
          <svg style="position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:#888" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <!-- Date (as-is) -->
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0">Date</span>
        <input type="date" id="date-from" onchange="setDateFrom(this.value)" style="padding:3px 8px;border:1.5px solid #dde0e7;border-radius:6px;font-size:11px;color:#333;outline:none;height:28px"/>
        <span style="font-size:10px;color:#aaa">to</span>
        <input type="date" id="date-to" onchange="setDateTo(this.value)" style="padding:3px 8px;border:1.5px solid #dde0e7;border-radius:6px;font-size:11px;color:#333;outline:none;height:28px"/>
        <button id="clear-dates-btn" onclick="clearDates()" style="display:none;font-size:10px;color:#0073ea;background:none;border:none;cursor:pointer;padding:0">&#10005;</button>
      </div>
    </div>
  </div>

  <!-- Board body (dynamic) -->
  <div id="board-wrap"></div>
</div>

let accessToken = null;

function initGis(){
  if(tokenClient) return;

    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: SCOPES,
    callback: (resp)=>{
      if(resp.error){
        isSyncing=false;
        const msg=resp.error==="access_denied"?"Access was denied.":String(resp.error);
        if(gatePending){ gatePending=false; gateShowError(msg); return; }
        setSyncUI("error","Google sign-in failed", msg,0);
        return;
      }
      accessToken = resp.access_token;
      fetchSheetData().then(()=>{ if(gatePending){ gatePending=false; hideLoginGate(); } });
    },
  });
}

let lastSyncPromptAt = 0;

function promptSync(){

let syncAttemptCounter=0;
function triggerSync(){

  // Google's callback may never fire at all — without this, the button would look
  // dead (isSyncing stuck true) on every future click.
  const syncAttemptId=++syncAttemptCounter;
  setTimeout(()=>{
    if(isSyncing && syncAttemptId===syncAttemptCounter){
      isSyncing=false;
      setSyncUI("error","Sign-in window didn't open","Your browser may have blocked the popup. Allow popups for this site and try again.",0);
    }
  }, 12000);
  tokenClient.requestAccessToken({prompt: accessToken ? "" : "consent"});
}

    const subsRange=data.valueRanges?.[1]?.values||[];

  }
}

// ── SHEET ROW HELPERS ─────────────────────────────────────────────────────────
// Turns [[header,header,...], [row,row,...], ...] into [{header:val,...}, ...]
function rowsToObjects(rows){
  if(!rows||!rows.length) return [];
  const headers=rows[0].map(h=>String(h||"").trim());
  const out=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r];
    if(!row||!row.length) continue;
    const obj={}; let hasAny=false;
    headers.forEach((h,i)=>{
      if(!h) return;
      const v=row[i]!==undefined?String(row[i]):"";
      obj[h]=v;
      if(v) hasAny=true;
    });
    if(hasAny) out.push(obj);
  }
  return out;
}

// ── BUILD DATA MODEL ─────────────────────────────────────────────────────────
function buildGroups(itemRows, subRows){
  // index subitems by parent item id
  const subMap={};
  subRows.forEach((row,idx)=>{
    const pid=(row.parent_item_id||"").trim(); if(!pid) return;
    if(!subMap[pid]) subMap[pid]=[];
    const raw24=(row.y2024||"").trim(), raw25=(row.y2025||"").trim(), raw26=(row.y2026||"").trim();
    const name=row.name||"";
    const isTensile=/tensile|MBS|break strength/i.test(name);
    // Tensile tests are required annually (12 months)
    const freq = isTensile ? {months:12, label:"Annual (12 months)"} : parseFreq(row.labs||"");
    const sid=(row.s||"").trim()||(pid+"_"+idx);
    subMap[pid].push({
      id:"s"+sid, rowId:sid, name,
      std:row.std||"", criteria:row.criteria||"",
      target:row.target||"", equipment:row.equipment||"",
      accreditation:row.accreditation||"", labs:row.labs||"",
      p24:parsePBlocks(raw24), p25:parsePBlocks(raw25), p26:parsePBlocks(raw26),
      isTensile, freq,
    });
  });

  const grpMap={};
  itemRows.forEach(row=>{
    const gtitle=(row.group||"Uncategorized").trim()||"Uncategorized";
    const gid="g_"+gtitle.replace(/[^a-z0-9]+/gi,"_").toLowerCase();
    if(!grpMap[gid]) grpMap[gid]={id:gid,title:gtitle,color:groupColor(gtitle),items:[]};

    const rid=(row.id||"").trim();
    const websiteUrl=extractWebsiteUrl(row.website||"","","");

    grpMap[gid].items.push({
      id:"i"+rid, rowId:rid, name:row.name||"",
      url:SHEET_EDIT_URL,
      parentSku:row.parentSku||"",
      description:row.description||"",
      prioritySku:row.prioritySku||"",
      websiteUrl,
      meetsClaim:row.meetsClaim||"",
      mechTesting:row.mechTesting||"",
      chemTesting:row.chemTesting||"",
      corrTesting:row.corrTesting||"",
      country:row.country||"",
      colors:row.colors||"",
      channel:row.channel||"",
      subs:subMap[rid]||[],
    });
  });

  applyReplication(Object.values(grpMap));
  return Object.values(grpMap).filter(g=>g.items.length>0);
}

function extractWebsiteUrl(text, rawValue, directUrl){
  // 1. Best source: LinkValue inline fragment url field — clean, no escaping needed
  if(directUrl) return directUrl.replace(/&amp;/g,"&");
  // 2. JSON value field: {"url":"...","text":"..."}
  if(rawValue){try{const v=JSON.parse(rawValue);if(v?.url) return v.url.replace(/&amp;/g,"&");}catch(e){}}
  // 3. Text format "Label text - https://url" — split on FIRST " - http"
  if(text){
    const i=text.indexOf(' - http');
    if(i!==-1) return text.slice(i+3).trim().replace(/&amp;/g,"&");
    const m=text.match(/https?:\/\/\S+/);
    if(m) return m[0].replace(/&amp;/g,"&");
  }
  return "";
}

// ── PARENT SKU REPLICATION ────────────────────────────────────────────────────
function applyReplication(groups){
  const all=[];
  groups.forEach(g=>g.items.forEach(i=>all.push(i)));
  const byParent={};
  all.forEach(i=>{
    const key=i.parentSku||i.name;
    if(!byParent[key]) byParent[key]=[];
    byParent[key].push(i);
  });
  Object.values(byParent).forEach(siblings=>{
    if(siblings.length<2) return;
    const donor=siblings.reduce((best,cur)=>{
      const cs=cur.subs.filter(s=>s.p24.length||s.p25.length||s.p26.length).length;
      const bs=best.subs.filter(s=>s.p24.length||s.p25.length||s.p26.length).length;
      return cs>bs?cur:best;
    },siblings[0]);
    if(!donor.subs.length) return;
    siblings.forEach(item=>{
      if(item.id===donor.id) return;
      const hasData=item.subs.some(s=>s.p24.length||s.p25.length||s.p26.length);
      if(!hasData){
        item.subs=donor.subs.map(s=>({...s,_replicated:true,_replicatedFrom:donor.name}));
        // replicate compliance fields
        if(!item.meetsClaim)  item.meetsClaim=donor.meetsClaim;
        if(!item.mechTesting) item.mechTesting=donor.mechTesting;
        if(!item.chemTesting) item.chemTesting=donor.chemTesting;
        if(!item.corrTesting) item.corrTesting=donor.corrTesting;
        // replicate website
        if(!item.websiteUrl)  item.websiteUrl=donor.websiteUrl;
        // replicate prioritySku if blank
        if(!item.prioritySku) item.prioritySku=donor.prioritySku;
        item._replicatedFrom=donor.name;
      }
    });
  });
}

// ── PRIORITY BLOCK PARSER ────────────────────────────────────────────────────
function parsePBlocks(raw){
  if(!raw||/^no\s*test$/i.test(raw.trim())||!raw.trim()) return [];
  const parts=raw.split(/(?=(?:Priority Supplier|Supplier Priority)\s*\d+\s*:)/i);
  const blocks=[];
  parts.forEach(part=>{
    part=part.trim(); if(!part) return;
    const lines=part.split("\n").map(l=>l.trim()).filter(Boolean);
    const hm=lines[0].match(/^(?:Priority Supplier|Supplier Priority)\s*(\d+)\s*:\s*(.*)$/i);
    const priority=hm?parseInt(hm[1]):(blocks.length+1);
    const supplierName=hm?hm[2].trim():"";
    const get=k=>{const l=lines.find(x=>x.toLowerCase().startsWith(k.toLowerCase()));return l?l.replace(/^[^:]+:\s*/,"").trim():"";};
    const getM=k=>{
      const idx=lines.findIndex(x=>x.toLowerCase().startsWith(k.toLowerCase()));
      if(idx===-1) return "";
      let val=lines[idx].replace(/^[^:]+:\s*/,"").trim();
      for(let i=idx+1;i<lines.length;i++){if(/^[A-Za-z][^:]{0,50}:/.test(lines[i])) break;val+=" "+lines[i];}
      return val.trim();
    };
    // Extract ALL report-type lines — any line with a URL that has "report" in the key name
    // Covers: Test Report, SAE Report, SAEJ684 Report, Initial Test Report, Final Test Report, etc.
    const reports=[];
    lines.forEach(line=>{
      const m=line.match(/^([^:]{0,60}report[^:]{0,30})\s*:\s*(https?:\/\/\S+)/i);
      if(m) reports.push({label:m[1].trim(), url:m[2].trim().replace(/&amp;/g,"&")});
    });
    // Fallback: if no labeled report lines found, grab first non-evidence URL
    const evidenceVal=getM("Evidence");
    const evidenceUrl=(evidenceVal.match(/https?:\/\/[^\s\n"')]+/)?.[0]||"").replace(/&amp;/g,"&");
    if(!reports.length){
      const allUrls=[...part.matchAll(/https?:\/\/[^\s\n"')]+/g)].map(m=>m[0].replace(/&amp;/g,"&"));
      const fallbackUrl=allUrls.find(u=>u!==evidenceUrl)||null;
      if(fallbackUrl) reports.push({label:"Report",url:fallbackUrl});
    }

    blocks.push({
      priority,
      supplier:supplierName||get("Supplier"),
      method:get("Test Method")||get("Tensile Test Method")||get("Method"),
      wwl:get("Rhino Test WWL")||get("WWL"),
      claim:get("Rhino Break Strength Test Claim")||get("Break Claim"),
      result:get("Test Result")||get("Result"),
      date:get("Test Completion Date")||get("Test Completion")||get("Date"),
      lab:get("Test Lab")||get("Lab"),
      cost:get("Cost"),
      reports,
      report:reports[0]?.url||null,
      cap:getM("Supplier CAP")||getM("CAP"),
      evidence:evidenceVal,
      remarks:getM("Remarks"),
    });
  });
  if(!blocks.length){
    // single block, no priority header
    const lines=raw.split("\n").map(l=>l.trim()).filter(Boolean);
    const get=k=>{const l=lines.find(x=>x.toLowerCase().startsWith(k.toLowerCase()));return l?l.replace(/^[^:]+:\s*/,"").trim():"";};
    const getM=k=>{const idx=lines.findIndex(x=>x.toLowerCase().startsWith(k.toLowerCase()));if(idx===-1)return "";let val=lines[idx].replace(/^[^:]+:\s*/,"").trim();for(let i=idx+1;i<lines.length;i++){if(/^[A-Za-z][^:]{0,50}:/.test(lines[i]))break;val+=" "+lines[i];}return val.trim();};
    const rl=lines.find(x=>/^test result/i.test(x));
    const evidenceVal=getM("Evidence");
    const evidenceUrl=evidenceVal.match(/https?:\/\/[^\s\n"')]+/)?.[0]||"";
    const reports=[];
    lines.forEach(line=>{
      const m=line.match(/^([^:]{0,60}report[^:]{0,30})\s*:\s*(https?:\/\/\S+)/i);
      if(m) reports.push({label:m[1].trim(),url:m[2].trim().replace(/&amp;/g,"&")});
    });
    if(!reports.length){
      const rm=raw.match(/https?:\/\/[^\s\n"')]+/);
      if(rm&&rm[0]!==evidenceUrl) reports.push({label:"Report",url:rm[0].replace(/&amp;/g,"&")});
    }
    blocks.push({priority:1,supplier:get("Supplier"),method:get("Test Method")||get("Tensile Test Method"),wwl:get("Rhino Test WWL"),claim:get("Rhino Break Strength Test Claim"),result:rl?rl.replace(/^[^:]+:\s*/,"").trim():get("Result"),date:get("Test Completion Date")||get("Test Completion")||get("Date"),lab:get("Test Lab"),cost:get("Cost"),reports,report:reports[0]?.url||null,cap:getM("Supplier CAP")||getM("CAP"),evidence:evidenceVal,remarks:getM("Remarks")});
  }
  return blocks;
}

function calcOverall(blocks){
  if(!blocks||!blocks.length) return "notest";
  const p1=blocks.find(b=>b.priority===1);
  if(p1&&p1.result){
    if(/\bFAIL\b/i.test(p1.result)) return "FAIL";
    if(/\bPASS\b/i.test(p1.result)) return "PASS";
  }
  const anyFail=blocks.some(b=>/\bFAIL\b/i.test(b.result||""));
  const anyPass=blocks.some(b=>/\bPASS\b/i.test(b.result||""));
  if(anyFail&&!anyPass) return "FAIL";
  if(anyPass) return "PASS";
  return blocks[0]?.result?"data":"notest";
}
function bestResult(sub){
  for(const k of ["p26","p25","p24"]){if(sub[k]&&sub[k].length) return calcOverall(sub[k]);}
  return "notest";
}

// ── MONITORING HELPERS ────────────────────────────────────────────────────────
function parseFreq(labsText){
  // Look for frequency hints like "12 months", "annual", "6 months" in the labs field
  const t=(labsText||"").toLowerCase();
  const m=t.match(/(\d+)\s*month/i);
  if(m) return {months:parseInt(m[1]),label:m[0]};
  if(t.includes("annual")||t.includes("yearly")) return {months:12,label:"Annual (12 months)"};
  if(t.includes("semi-annual")||t.includes("biannual")) return {months:6,label:"Semi-annual (6 months)"};
  if(t.includes("quarterly")) return {months:3,label:"Quarterly (3 months)"};
  return null;
}
function latestTestDate(sub){
  let best=null;
  for(const k of ["p26","p25","p24"]){
    (sub[k]||[]).forEach(b=>{
      const d=parseDate(b.date);
      if(d&&(!best||d>best)) best=d;
    });
  }
  return best;
}
function parseDate(s){
  if(!s) return null;
  // MM/DD/YYYY
  const p=s.split("/"); if(p.length===3){const d=new Date(p[2],p[0]-1,p[1]);if(!isNaN(d)) return d;}
  const d=new Date(s); return isNaN(d)?null:d;
}
function calcExpiry(sub, itemId){
  const last=latestTestDate(sub); if(!last) return null;
  const decision = itemId ? getRetestDecision(itemId, sub.id) : "";
  // Rule: 2024 test → +2 years. 2025 onward → +1 year.
  const lastYear=last.getFullYear();
  const addYears = lastYear <= 2024 ? 2 : 1;
  const standardDue=new Date(last);
  standardDue.setFullYear(standardDue.getFullYear()+addYears);
  if(decision==="next"){
    // Defer: standard due + 12 months
    const deferred=new Date(standardDue);
    deferred.setMonth(deferred.getMonth()+12);
    return deferred;
  }
  return standardDue;
}
function monStatus(sub, itemId){
  const exp=calcExpiry(sub, itemId); if(!exp) return "none";
  const decision = itemId ? getRetestDecision(itemId, sub.id) : "";
  if(decision==="next") return "deferred";
  const days=Math.round((exp-new Date())/(86400000));
  if(days<0)   return "overdue";    // 🔴 past due date
  if(days<=180) return "due_soon";  // 🟡 within 6 months
  return "ok";                       // 🟢 more than 6 months away
}
function fmtD(d){return d?d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";}

  if(tl.includes("walmart")) return "#0073ea";

  const p=["#a358df","#00c875","#0073ea","#fdab3d","#e2445c","#037f4c","#ff642e"];
  let h=0;for(const c of (t||"")) h=(h*31+c.charCodeAt(0))&0xffff;

}

// ── FILTER / SORT ─────────────────────────────────────────────────────────────
function matchF(item){
  if(fCountry!=="ALL"&&item.country!==fCountry) return false;
  if(fResult!=="ALL"&&!item.subs.some(s=>bestResult(s)===fResult)) return false;
  if(fPriority!=="ALL"&&item.prioritySku!==fPriority) return false;
  if(fSku&&item.id!=="i"+fSku&&item.name!==fSku) return false;
  if(fGroup!=="ALL"){
    // find which group this item belongs to
    let itemGroup="";
    GROUPS.forEach(g=>g.items.forEach(i=>{if(i.id===item.id) itemGroup=g.title;}));
    if(itemGroup!==fGroup) return false;
  }
  if(fDateFrom||fDateTo){
    const from=fDateFrom?new Date(fDateFrom):null;
    const to=fDateTo?new Date(fDateTo):null;
    // match if any test date in any year block falls within range
    const hasMatch=item.subs.some(sub=>{
      const dates=[];
      [sub.p24,sub.p25,sub.p26].forEach(blocks=>(blocks||[]).forEach(b=>{
        const d=parseDate(b.date); if(d) dates.push(d);
      }));
      return dates.some(d=>(!from||d>=from)&&(!to||d<=to));
    });
    if(!hasMatch) return false;
  }
  if(searchQ){
    const q=searchQ.toLowerCase();
    // Build a comprehensive haystack — name, description, parentSku, all skus, subs
    const haystack=[
      item.name,
      item.description,
      item.parentSku,
      item.prioritySku,
      item.country,
      item.channel,
      item.colors,
      item.mechTesting,
      item.chemTesting,
      item.corrTesting,
      item.meetsClaim,
      // Also search each word segment of the name (e.g. "HDKIT" matches "HDKIT-4PK-GRN")
      ...item.name.split(/[-_\s]/),
      ...item.subs.map(s=>s.name+" "+s.std+" "+s.criteria)
    ].join(" ").toLowerCase();
    if(!haystack.includes(q)) return false;
  }
  return true;
}
function getVis(){
  let all=[];
  GROUPS.forEach(g=>g.items.forEach(i=>all.push({...i,_gid:g.id,_gtitle:g.title,_gc:g.color})));
  all=all.filter(matchF);
  if(sortS) all.sort((a,b)=>{
    const av=(a[sortS.col]||"").toLowerCase(),bv=(b[sortS.col]||"").toLowerCase();
    return sortS.dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
  });
  return all;
}
function groupVis(items){
  const m={};
  items.forEach(i=>{if(!m[i._gid])m[i._gid]={id:i._gid,title:i._gtitle,color:i._gc,items:[]};m[i._gid].items.push(i);});
  return Object.values(m);
}

// ── KPI ───────────────────────────────────────────────────────────────────────
function calcKPIs(){
  let pass=0,fail=0,notest=0,overdue=0,dueSoon=0;

  // Per-priority completion: count at ITEM level
  // Priority SKU values: A, B, C, Retail (exact values from monday board)
  const priGroups={A:{done:0,total:0},B:{done:0,total:0},C:{done:0,total:0},Retail:{done:0,total:0}};

  GROUPS.forEach(g=>g.items.forEach(item=>{
    const pri=(item.prioritySku||"").trim(); // exact value from board: A, B, C, Retail
    // Simple rule: item has ANY subtest with data = 1 tested SKU
    // Replicated items also count — they share verified test data
    const hasDone = item.subs.length > 0 && item.subs.some(s=>
      (s.p24&&s.p24.length>0)||(s.p25&&s.p25.length>0)||(s.p26&&s.p26.length>0)
    );

    // Match case-insensitively against known tiers
    const priKey=Object.keys(priGroups).find(k=>k.toLowerCase()===pri.toLowerCase());
    if(priKey){
      priGroups[priKey].total++;
      if(hasDone) priGroups[priKey].done++;
    }

    item.subs.forEach(sub=>{
      const r=bestResult(sub);
      if(r==="PASS") pass++; else if(r==="FAIL") fail++; else notest++;
      if((sub.p24&&sub.p24.length>0)||(sub.p25&&sub.p25.length>0)||(sub.p26&&sub.p26.length>0)){
        const ms=monStatus(sub,item.id);
        if(ms==="overdue") overdue++;
        else if(ms==="due_soon") dueSoon++;
      }
    });
  }));

  // Completion rate per group
  const priRate=(g)=>g.total>0?Math.round(g.done/g.total*100):null;

  const completed=pass+fail,total=completed+notest;
  const rate=completed>0?Math.round(pass/completed*100):null;
  return{pass,fail,notest,completed,total,rate,overdue,dueSoon,priGroups,priRate};
}

// ── MONITORING TAB ────────────────────────────────────────────────────────────
function renderMonitoring(){
  const wrap=document.getElementById("board-wrap"); if(!wrap) return;
  if(!GROUPS.length){
    wrap.innerHTML=`<div style="text-align:center;padding:48px;color:#aaa"><div style="font-size:32px">📅</div><div style="margin-top:8px;font-size:12px">Sync data first to see the monitoring schedule.</div></div>`;
    return;
  }

  // Group all items by parentSku
  const allItems=[];
  GROUPS.forEach(g=>g.items.forEach(i=>allItems.push({g,i})));
  const byParent={};
  allItems.forEach(({g,i})=>{
    const key=i.parentSku||i.rowId;
    if(!byParent[key]) byParent[key]=[];
    byParent[key].push({g,i});
  });

  // Build all monitoring rows
  let allRows=[];
  Object.values(byParent).forEach(siblings=>{
    const donorEntry=siblings.find(({i})=>i.subs.some(s=>s.p24.length||s.p25.length||s.p26.length));
    if(!donorEntry) return;
    const {g,i:donor}=donorEntry;
    const subsWith2024=donor.subs.filter(s=>
      (s.p24&&s.p24.length>0)||(s.p25&&s.p25.length>0)||(s.p26&&s.p26.length>0)
    );
    const subStatuses=subsWith2024.map(s=>({
      sub:s,decision:getRetestDecision(donor.id,s.id),
      last:latestTestDate(s),exp:calcExpiry(s,donor.id),ms:monStatus(s,donor.id)
    }));
    let ms="none",exp=null,last=null;
    if(subStatuses.length>0){
      const dueOnes=subStatuses.filter(s=>s.decision!=="next");
      const allDeferred=dueOnes.length===0;
      if(allDeferred){
        ms="deferred";
        const sorted=[...subStatuses].sort((a,b)=>(a.exp?.getTime()||0)-(b.exp?.getTime()||0));
        exp=sorted[0]?.exp||null; last=sorted[0]?.last||null;
      } else {
        const order={overdue:0,due_soon:1,ok:2};
        const sorted=[...dueOnes].sort((a,b)=>(order[a.ms]??3)-(order[b.ms]??3));
        ms=sorted[0]?.ms||"none"; exp=sorted[0]?.exp||null; last=sorted[0]?.last||null;
      }
    }
    const siblingNames=siblings.filter(({i})=>i.id!==donor.id).map(({i})=>i.name);
    const parentKey=donor.parentSku||donor.rowId;
    allRows.push({g,donor,ms,exp,last,siblingNames,allSubs:donor.subs,subsWith2024,parentKey});
  });

  // Apply filters
  let rows=[...allRows];
  if(monFocusParent) rows=rows.filter(r=>r.parentKey===monFocusParent);
  if(monSearchQ){
    const q=monSearchQ.toLowerCase();
    rows=rows.filter(r=>
      r.donor.name.toLowerCase().includes(q)||
      r.siblingNames.some(n=>n.toLowerCase().includes(q))||
      r.allSubs.some(s=>s.name.toLowerCase().includes(q))
    );
  }
  if(monFilterStatus!=="ALL"){
    rows=rows.filter(r=>{
      if(monFilterStatus==="deferred") return r.subsWith2024.every(s=>getRetestDecision(r.donor.id,s.id)==="next");
      return r.subsWith2024.some(s=>monStatus(s,r.donor.id)===monFilterStatus);
    });
  }
  if(monFilterDecision!=="ALL"){
    rows=rows.filter(r=>r.subsWith2024.some(s=>getRetestDecision(r.donor.id,s.id)===monFilterDecision));
  }
  if(monFilterPriority!=="ALL"){
    rows=rows.filter(r=>(r.donor.prioritySku||"").trim().toLowerCase()===monFilterPriority.toLowerCase());
  }

  // Count per-subtest for stat cards
  let cntOverdue=0,cntSoon=0,cntOk=0,cntDeferred=0;
  rows.forEach(({donor,subsWith2024})=>{
    subsWith2024.forEach(s=>{
      const sm=monStatus(s,donor.id);
      if(sm==="overdue") cntOverdue++;
      else if(sm==="due_soon") cntSoon++;
      else if(sm==="ok") cntOk++;
      else if(sm==="deferred") cntDeferred++;
    });
  });

  const cg="minmax(180px,1.5fr) minmax(200px,2fr) minmax(300px,2fr) 190px";
  const hdrs=["Product / SKUs","Annual Test Requirements","Schedule per Test","Management Decision"];

  let h=`<div style="padding:14px 18px">`;

  // Search + filter bar
  const clearFocusBtn=monFocusParent?`<button onclick="clearMonFocus()" style="display:inline-flex;align-items:center;gap:4px;background:#e8f2ff;color:#0055bb;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid #c0d8f8;cursor:pointer">${esc(monFocusParent)} ✕</button>`:""
  const sBtn=(val,lbl,c)=>`<button onclick="monFilterStatus='${val}';renderMonitoring()" style="font-size:11px;font-weight:600;padding:3px 12px;border-radius:20px;cursor:pointer;border:1px solid ${monFilterStatus===val?"#0073ea":"#dde0e7"};background:${monFilterStatus===val?"#e8f2ff":"#fff"};color:${monFilterStatus===val?"#0055bb":c}">${lbl}</button>`;
  const dBtn=(val,lbl)=>`<button onclick="monFilterDecision='${val}';renderMonitoring()" style="font-size:11px;font-weight:600;padding:3px 12px;border-radius:20px;cursor:pointer;border:1px solid ${monFilterDecision===val?"#0073ea":"#dde0e7"};background:${monFilterDecision===val?"#e8f2ff":"#fff"};color:${monFilterDecision===val?"#0055bb":"#555"}">${lbl}</button>`;
  const pBtn=(val,lbl,c)=>`<button onclick="monFilterPriority='${val}';renderMonitoring()" style="font-size:11px;font-weight:600;padding:3px 12px;border-radius:20px;cursor:pointer;border:1px solid ${monFilterPriority===val?"#0073ea":"#dde0e7"};background:${monFilterPriority===val?"#e8f2ff":"#fff"};color:${monFilterPriority===val?"#0055bb":c}">${lbl}</button>`;

  h+=`<div style="background:#fff;border:1.5px solid #e0e3ea;border-radius:10px;padding:10px 14px;margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <div style="position:relative;flex:1;min-width:180px;max-width:300px">
        <svg style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#aaa" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input value="${esc(monSearchQ)}" oninput="monSearchQ=this.value;renderMonitoring()" placeholder="Search SKU or test name…" style="width:100%;padding:6px 10px 6px 28px;border:1.5px solid #dde0e7;border-radius:7px;font-size:12px;background:#fafbfc;color:#333;outline:none;height:32px" autocomplete="off"/>
      </div>
      ${clearFocusBtn}
      ${(monSearchQ||monFilterStatus!=="ALL"||monFilterDecision!=="ALL"||monFocusParent||monFilterPriority!=="ALL")?`<button onclick="clearMonFilters()" style="font-size:11px;color:#e2445c;background:none;border:none;cursor:pointer;font-weight:500">✕ Clear all</button>`:""}
      <button onclick="exportMonitoringExcel()" style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:5px 14px;font-size:11px;font-weight:600;color:#0a7a46;background:#f0fff8;border:1.5px solid #c3f0da;border-radius:7px;cursor:pointer">📊 Export Excel</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">
      <span style="font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.4px">Priority:</span>
      ${pBtn("ALL","All","#555")}
      ${pBtn("Retail","★ Retail","#0a7a46")}
      ${pBtn("A","A SKU","#0055bb")}
      ${pBtn("B","B SKU","#b07000")}
      ${pBtn("C","C SKU","#7c3aed")}
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span style="font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.4px">Status:</span>
      ${sBtn("ALL","All","#555")}
      ${sBtn("overdue","🔴 Retest Due","#c0392b")}
      ${sBtn("due_soon","🟡 Due Soon","#b07000")}
      ${sBtn("ok","🟢 On Track","#0a7a46")}
      ${sBtn("deferred","🔵 Deferred","#0055bb")}

      ${dBtn("ALL","All")}
      ${dBtn("now","✓ Retest Now")}
      ${dBtn("next","🔵 Deferred")}
    </div>
  </div>`;

  // Alert banner
  if(cntOverdue||cntSoon){
    h+=`<div style="background:#fff8f8;border:1.5px solid #ffc0c0;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px">
      <span style="font-size:20px;flex-shrink:0">🔴</span>
      <div><div style="font-size:13px;font-weight:700;color:#c0392b;margin-bottom:3px">Action Required</div>
      <div style="font-size:11px;color:#555;line-height:1.6">${cntOverdue?`<strong>${cntOverdue} test${cntOverdue>1?"s":""} overdue</strong> — retesting is past due. `:""
      }${cntSoon?`<strong>${cntSoon} test${cntSoon>1?"s":""} due within 6 months</strong> — schedule now.`:""}</div>
      </div></div>`;
  }

  // Stat cards — clickable to filter
  h+=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
    ${[{l:"Retest Due",n:cntOverdue,bg:"#fff0f0",c:"#c0392b",br:"#ffd0d0",f:"overdue"},
       {l:"Due Soon <6mo",n:cntSoon,bg:"#fffdf0",c:"#b07000",br:"#fde8c0",f:"due_soon"},
       {l:"On Track >6mo",n:cntOk,bg:"#f0fff8",c:"#0a7a46",br:"#c3f0da",f:"ok"},
       {l:"Deferred",n:cntDeferred,bg:"#f0f6ff",c:"#0055bb",br:"#c0d8f8",f:"deferred"}]
    .map(s=>`<div style="background:${s.bg};border:1.5px solid ${s.br};border-radius:8px;padding:10px 16px;flex:1;min-width:80px;text-align:center">
      <div style="font-size:24px;font-weight:700;color:${s.c}">${s.n}</div>

    </div>`).join("")}
  </div>`;

  if(rows.length===0){
    h+=`<div style="text-align:center;padding:48px;color:#aaa"><div style="font-size:32px">🔍</div><div style="font-size:12px;margin-top:8px">No items match the current filters.</div></div>`;
  } else {
    h+=`<div style="border:1.5px solid #e0e0e0;border-radius:10px;overflow:hidden">
      <div style="display:grid;grid-template-columns:${cg};background:#f2f3f6;border-bottom:1.5px solid #dde0e9">
        ${hdrs.map(hd=>`<div style="padding:8px 12px;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;border-right:0.5px solid #dde0e9">${hd}</div>`).join("")}
      </div>`;

    rows.forEach(({g,donor,siblingNames,allSubs,subsWith2024})=>{
      const bgRow="#fff";

      // Product cell
      const productCell=`<div style="padding:10px 12px;border-right:0.5px solid #e8eaed">
        <div style="display:flex;align-items:flex-start;gap:6px">
          <div style="width:4px;border-radius:2px;background:${g.color};flex-shrink:0;min-height:16px;margin-top:2px"></div>
          <div>
            <div style="font-size:11px;font-weight:700;color:#222">${esc(donor.name)}</div>
            ${siblingNames.map(n=>`<div style="font-size:10px;color:#bbb;margin-top:2px">${esc(n)}</div>`).join("")}
          </div>
        </div>
      </div>`;

      // Annual Test Requirements cell
      const subRows=allSubs.map(s=>{
        const sbr=bestResult(s);
        const dotColor=sbr==="PASS"?"#00c875":sbr==="FAIL"?"#e2445c":"#ccc";
        const hasAnnual=(s.p24&&s.p24.length>0)||(s.p25&&s.p25.length>0)||(s.p26&&s.p26.length>0);
        return `<div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">
          <div style="width:7px;height:7px;border-radius:50%;background:${dotColor};flex-shrink:0"></div>
          <span style="font-size:10px;color:#333;flex:1">${esc(s.name)}</span>
          ${hasAnnual?`<span style="font-size:8px;font-weight:700;color:#0073ea;background:#e8f2ff;padding:1px 5px;border-radius:10px;flex-shrink:0">Annual</span>`:""}
        </div>`;
      }).join("");
      const testCell=`<div style="padding:10px 12px;border-right:0.5px solid #e8eaed">${subRows||`<span style="font-size:10px;color:#bbb">—</span>`}</div>`;

      // Per-subtest schedule
      const scheduleCell=`<div style="padding:10px 12px;border-right:0.5px solid #e8eaed">
        ${subsWith2024.length===0?`<span style="color:#bbb;font-size:10px">—</span>`:subsWith2024.map(s=>{
          const dec=getRetestDecision(donor.id,s.id);
          const sExp=calcExpiry(s,donor.id);
          const sLast=latestTestDate(s);
          const sMs=monStatus(s,donor.id);
          const sDays=sExp?Math.round((sExp-new Date())/86400000):null;
          const icon=sMs==="overdue"?"🔴":sMs==="due_soon"?"🟡":sMs==="ok"?"🟢":sMs==="deferred"?"🔵":"⚪";
          const dateColor=sMs==="overdue"?"#c0392b":sMs==="due_soon"?"#b07000":sMs==="deferred"?"#0055bb":sMs==="ok"?"#0a7a46":"#888";
          const daysText=sDays===null?"":sDays<0?`${Math.abs(sDays)}d overdue`:sMs==="deferred"?`${sDays}d (deferred)`:`${sDays}d left`;
          return `<div style="margin-bottom:7px;padding:6px 8px;border-radius:5px;background:${sMs==="overdue"?"#fff8f8":sMs==="due_soon"?"#fffdf0":sMs==="deferred"?"#f0f6ff":sMs==="ok"?"#f0fff8":"#f7f8fa"};border:1px solid ${sMs==="overdue"?"#ffc0c0":sMs==="due_soon"?"#fde8c0":sMs==="deferred"?"#c0d8f8":sMs==="ok"?"#c3f0da":"#e0e0e0"}">
            <div style="font-size:9px;font-weight:600;color:#555;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span style="font-size:9px">${icon}</span>
              ${sLast?`<span style="font-size:9px;color:#888">Last: ${fmtD(sLast)}</span>`:""}
              ${sExp?`<span style="font-size:9px;font-weight:700;color:${dateColor}">Due: ${fmtD(sExp)}</span>`:""}
              ${daysText?`<span style="font-size:9px;color:${dateColor}">(${daysText})</span>`:""}
            </div>
          </div>`;
        }).join("")}
      </div>`;

      // Management Decision cell
      const decisionCell=`<div style="padding:10px 12px">
        ${subsWith2024.length===0?`<span style="color:#bbb;font-size:10px">—</span>`:subsWith2024.map(s=>{
          const dec=getRetestDecision(donor.id,s.id);
          const lastD=latestTestDate(s);
          const lastYear=lastD?lastD.getFullYear():null;
          const addYears=lastYear&&lastYear<=2024?2:1;
          const retestYear=lastYear?lastYear+addYears:"—";
          const standardDue=lastD?new Date(new Date(lastD).setFullYear(lastD.getFullYear()+addYears)):null;
          const deferDate=standardDue?new Date(new Date(standardDue).setMonth(standardDue.getMonth()+12)):null;
          const deferLabel=deferDate?fmtD(deferDate):"next year";
          return `<div style="margin-bottom:8px;padding-bottom:8px;border-bottom:0.5px dashed #e0e0e0">
            <div style="font-size:9px;font-weight:600;color:#555;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</div>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:4px;padding:4px 7px;border-radius:6px;border:1px solid ${dec==="now"?"#ffc0c0":"#e0e3ea"};background:${dec==="now"?"#fff0f0":"#fafbfc"}">
              <input type="checkbox" ${dec==="now"?"checked":""} onchange="toggleRetestNow('${donor.id}','${s.id}',this.checked)" onclick="event.stopPropagation()" style="width:12px;height:12px;cursor:pointer;accent-color:#c0392b"/>
              <div style="font-size:10px"><div style="color:${dec==="now"?"#c0392b":"#555"};font-weight:${dec==="now"?"700":"500"}">Retest Now</div><div style="font-size:8px;color:#aaa">Target: ${retestYear}</div></div>
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 7px;border-radius:6px;border:1px solid ${dec==="next"?"#c0d8f8":"#e0e3ea"};background:${dec==="next"?"#f0f6ff":"#fafbfc"}">
              <input type="checkbox" ${dec==="next"?"checked":""} onchange="toggleRetestNext('${donor.id}','${s.id}',this.checked)" onclick="event.stopPropagation()" style="width:12px;height:12px;cursor:pointer;accent-color:#0073ea"/>
              <div style="font-size:10px"><div style="color:${dec==="next"?"#0055bb":"#555"};font-weight:${dec==="next"?"700":"500"}">Defer</div><div style="font-size:8px;color:#aaa">Skip ${retestYear} → ${deferLabel}</div></div>
            </label>
          </div>`;
        }).join("")}
      </div>`;

      h+=`<div style="display:grid;grid-template-columns:${cg};border-bottom:0.5px solid #e8eaed;align-items:start">
        ${productCell}${testCell}${scheduleCell}${decisionCell}
      </div>`;
    });

    h+=`</div><div style="margin-top:8px;font-size:10px;color:#aaa;text-align:right">🟢 On Track >6mo · 🟡 Due Soon <6mo · 🔴 Retest Due = past due · Defer adds +12mo to due date</div>`;
  }
  h+=`</div>`;
  wrap.innerHTML=h;
}

// ── TEST EXPENSE TAB ──────────────────────────────────────────────────────────
function parseCost(str){
  if(!str) return null;
  const m=str.replace(/,/g,"").match(/\$?([\d]+\.?[\d]*)/);
  return m?parseFloat(m[1]):null;
}

function testCategory(name){
  const n=(name||"").toLowerCase();
  if(/tensile|mbs|break|load|fatigue|pull|mechanical|performance|elongation|abrasion|spindle|ratchet|physical|durability|impact|compression|lashing|capacity|welding/i.test(n)) return "Mechanical";
  if(/chemical|prop65|reach|phthalate|svhc|rohs|heavy metal|flame|toxic|cadmium|lead|substance|restricted/i.test(n)) return "Chemical";
  if(/corrosion|salt spray|coating|rust|zinc|plating|astm b117/i.test(n)) return "Corrosion";
  if(/packaging|labeling|label|documentation|marking|claim|verification|audit|safety risk|regulatory|compliance/i.test(n)) return "Regulatory";
  return "Other";
}

function buildExpenseRows(){
  const all=[];
  GROUPS.forEach(g=>g.items.forEach(item=>{
    const siblings=[];
    GROUPS.forEach(g2=>g2.items.forEach(i2=>{
      if(i2.id!==item.id&&i2.parentSku&&i2.parentSku===item.parentSku) siblings.push(i2.name);
    }));
    item.subs.forEach(sub=>{
      [[sub.p24,"2024"],[sub.p25,"2025"],[sub.p26,"2026"]].forEach(([blocks,yr])=>{
        if(!blocks||!blocks.length) return;
        blocks.forEach(b=>{
          const cost=parseCost(b.cost);
          if(cost===null) return;
          all.push({
            group:g.title,groupColor:g.color,
            item,siblings,
            subName:sub.name,
            category:testCategory(sub.name),
            year:yr,
            supplier:b.supplier||"",
            lab:b.lab||"",
            date:b.date||"",
            result:b.result||"",
            cost,costRaw:b.cost||"",
            priority:(item.prioritySku||"").trim(),
          });
        });
      });
    });
  }));
  return all;
}

function renderExpense(){
  const wrap=document.getElementById("board-wrap"); if(!wrap) return;
  if(!GROUPS.length){
    wrap.innerHTML=`<div style="text-align:center;padding:64px;color:#aaa"><div style="font-size:48px">💰</div><div style="font-size:14px;margin-top:12px">Sync data first to see test expense data.</div></div>`;
    return;
  }

  const allRows=buildExpenseRows();

  // Apply filters
  let rows=[...allRows];
  if(expFilterPriority!=="ALL") rows=rows.filter(r=>r.priority.toLowerCase()===expFilterPriority.toLowerCase());
  if(expFilterCategory!=="ALL") rows=rows.filter(r=>r.category===expFilterCategory);
  if(expFilterYear!=="ALL") rows=rows.filter(r=>r.year===expFilterYear);

  // ── Aggregations ──
  const totalCost=rows.reduce((s,r)=>s+r.cost,0);
  const byYear={2024:0,2025:0,2026:0};
  rows.forEach(r=>{if(byYear[r.year]!==undefined) byYear[r.year]+=r.cost;});
  const byCat={};
  rows.forEach(r=>{byCat[r.category]=(byCat[r.category]||0)+r.cost;});
  const bySupplier={};
  rows.forEach(r=>{if(r.supplier) bySupplier[r.supplier]=(bySupplier[r.supplier]||0)+r.cost;});
  const byGroup={};
  rows.forEach(r=>{byGroup[r.group]=(byGroup[r.group]||0)+r.cost;});
  // Sub-category breakdown (by actual subtest name within selected category)
  const bySubCat={};
  rows.forEach(r=>{
    const key=r.subName;
    bySubCat[key]=(bySubCat[key]||0)+r.cost;
  });

  const catColors={Mechanical:"#0073ea",Chemical:"#00c875",Corrosion:"#fdab3d",Regulatory:"#a358df",Other:"#c4c4c4"};
  const yearColors={"2024":"#0073ea","2025":"#00c875","2026":"#e2445c"};
  const groupColorPalette=["#0073ea","#00c875","#fdab3d","#e2445c","#a358df","#579bfc","#66ccff","#ff7f50"];

  const fmt=n=>n===null?"—":"$"+n.toFixed(2);
  const fmtK=n=>n>=1000?"$"+(n/1000).toFixed(1)+"k":"$"+n.toFixed(0);
  const catEntries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const topSuppliers=Object.entries(bySupplier).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const groupEntries=Object.entries(byGroup).sort((a,b)=>b[1]-a[1]).slice(0,6);
  // Top sub-categories (by subtest name) for selected category or all
  const topSubCats=Object.entries(bySubCat).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // ── Bar chart helper ──
  function barChart(data,height=120){
    if(!data.length) return `<div style="color:#bbb;font-size:11px;text-align:center;padding:20px">No data</div>`;
    const maxV=Math.max(...data.map(d=>d[1]),1);
    return `<div style="display:flex;align-items:flex-end;gap:4px;height:${height}px;padding:8px 0 0">
      ${data.map(([label,val,color])=>{
        const h2=Math.max(4,Math.round((val/maxV)*(height-24)));
        return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0">
          <div style="font-size:8px;color:#555;font-weight:600;margin-bottom:2px;text-align:center">${fmtK(val)}</div>
          <div style="width:100%;background:${color||"#0073ea"};border-radius:3px 3px 0 0;height:${h2}px"></div>
          <div style="font-size:7px;color:#888;margin-top:3px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;padding:0 1px">${esc(label.length>12?label.slice(0,12)+"…":label)}</div>
        </div>`;
      }).join("")}
    </div>`;
  }

  // ── Horizontal bar chart for sub-category breakdown ──
  function hBarChart(data){
    if(!data.length) return `<div style="color:#bbb;font-size:11px;padding:8px">No data</div>`;
    const maxV=Math.max(...data.map(d=>d[1]),1);
    return data.map(([label,val,color],i)=>{
      const pct=Math.max(2,Math.round(val/maxV*100));
      return `<div style="margin-bottom:7px">
        <div style="display:flex;justify-content:space-between;margin-bottom:2px">
          <span style="font-size:10px;color:#333;font-weight:${i<3?"600":"400"};flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px">${esc(label)}</span>
          <span style="font-size:10px;font-weight:600;color:${color||"#0073ea"};flex-shrink:0">${fmtK(val)}</span>
        </div>
        <div style="height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden">
          <div style="height:100%;background:${color||"#0073ea"};border-radius:3px;width:${pct}%"></div>
        </div>
      </div>`;
    }).join("");
  }

  // ── Donut chart ──
  function donutChart(segments,size=130){
    const total=segments.reduce((s,[,v])=>s+v,0);
    if(!total) return `<div style="color:#bbb;font-size:11px;text-align:center;padding:20px">No data</div>`;
    let angle=-90;
    const cx=size/2,cy=size/2,r=size*0.38,ir=size*0.22;
    const paths=segments.map(([,val,color])=>{
      const a=Math.max(0.1,(val/total)*360);
      const r1=angle*(Math.PI/180),r2=(angle+a)*(Math.PI/180);
      const x1=cx+r*Math.cos(r1),y1=cy+r*Math.sin(r1);
      const x2=cx+r*Math.cos(r2),y2=cy+r*Math.sin(r2);
      const xi1=cx+ir*Math.cos(r1),yi1=cy+ir*Math.sin(r1);
      const xi2=cx+ir*Math.cos(r2),yi2=cy+ir*Math.sin(r2);
      const laf=a>180?1:0;
      const d=`M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${laf},1 ${x2.toFixed(1)},${y2.toFixed(1)} L${xi2.toFixed(1)},${yi2.toFixed(1)} A${ir},${ir} 0 ${laf},0 ${xi1.toFixed(1)},${yi1.toFixed(1)} Z`;
      angle+=a;
      return `<path d="${d}" fill="${color}" stroke="#fff" stroke-width="1.5"/>`;
    });
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      ${paths.join("")}
      <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="11" font-weight="700" fill="#333">${fmtK(total)}</text>
      <text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="8" fill="#888">Total</text>
    </svg>`;

function openSiblingModal(itemId){
  let found=null;
  GROUPS.forEach(g=>g.items.forEach(i=>{ if(i.id===itemId) found=i; }));
  if(!found) return;
  const siblings=[];
  GROUPS.forEach(g=>g.items.forEach(i=>{
    if(i.id!==found.id&&i.parentSku&&i.parentSku===found.parentSku) siblings.push(i.name);
  }));
  openModal({type:"siblings",name:found.name,parentSku:found.parentSku,siblings});
}

function downloadXLSX(wb, filename){
  if(typeof XLSX==="undefined"){
    // XLSX not loaded yet - wait for CDN then retry
    alert("Loading Excel library, please try again in a moment...");
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=function(){ alert("Excel library loaded! Please click Export Excel again."); };
    document.head.appendChild(s);
    return;
  }
  try{
    const wbout=XLSX.write(wb,{bookType:"xlsx",type:"base64"});
    const a=document.createElement("a");
    a.href="data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,"+wbout;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){ alert("Export failed: "+e.message); }
}

function exportExpenseCSV(){
  if(typeof XLSX==="undefined"){ alert("Excel library not loaded. Please check your internet connection."); return; }
  const data=[["Product","Test Name","Category","Group","Supplier","Test Lab","Date","Year","Result","Cost ($)"]];
  GROUPS.forEach(g=>g.items.forEach(item=>{
    item.subs.forEach(sub=>{
      [["2024",sub.p24],["2025",sub.p25],["2026",sub.p26]].forEach(([yr,blocks])=>{
        if(!blocks) return;
        blocks.forEach(b=>{
          const cost=parseCost(b.cost);
          if(cost===null) return;
          data.push([item.name,sub.name,testCategory(sub.name),g.title,b.supplier||"",b.lab||"",b.date||"",yr,b.result||"",cost]);
        });
      });
    });
  }));
  const ws=XLSX.utils.aoa_to_sheet(data);
  ws["!cols"]=[{wch:25},{wch:35},{wch:14},{wch:20},{wch:30},{wch:15},{wch:14},{wch:8},{wch:10},{wch:10}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Test Expense");
  downloadXLSX(wb,"Test-Expense-"+new Date().toISOString().slice(0,10)+".xlsx");
}

function exportMonitoringExcel(){
  if(typeof XLSX==="undefined"){ alert("Excel library not loaded. Please check your internet connection."); return; }
  const data=[["Product Group","SKU","Siblings","Priority","Test Name","Last Tested","Next Due Date","Days Remaining","Status","Decision","Target Year","Defer Date"]];
  const allItems=[];
  GROUPS.forEach(g=>g.items.forEach(i=>allItems.push({g,i})));
  const byParent={};
  allItems.forEach(({g,i})=>{const k=i.parentSku||i.rowId;if(!byParent[k])byParent[k]=[];byParent[k].push({g,i});});
  Object.values(byParent).forEach(siblings=>{
    const de=siblings.find(({i})=>i.subs.some(s=>s.p24.length||s.p25.length||s.p26.length));
    if(!de) return;
    const {g,i:donor}=de;
    const sibNames=siblings.filter(({i})=>i.id!==donor.id).map(({i})=>i.name).join(", ");
    const subs=donor.subs.filter(s=>(s.p24&&s.p24.length>0)||(s.p25&&s.p25.length>0)||(s.p26&&s.p26.length>0));
    subs.forEach(s=>{
      const dec=getRetestDecision(donor.id,s.id);
      const sLast=latestTestDate(s);
      const sExp=calcExpiry(s,donor.id);
      const sMs=monStatus(s,donor.id);
      const sDays=sExp?Math.round((sExp-new Date())/86400000):null;
      const lastYear=sLast?sLast.getFullYear():null;
      const addYears=lastYear&&lastYear<=2024?2:1;
      const retestYear=lastYear?lastYear+addYears:"";
      const standardDue=sLast?new Date(new Date(sLast).setFullYear(sLast.getFullYear()+addYears)):null;
      const deferDate=standardDue?new Date(new Date(standardDue).setMonth(standardDue.getMonth()+12)):null;
      data.push([g.title,donor.name,sibNames,donor.prioritySku||"",s.name,sLast?fmtD(sLast):"",sExp?fmtD(sExp):"",sDays!==null?sDays:"",sMs==="overdue"?"Retest Due":sMs==="due_soon"?"Due Soon":sMs==="ok"?"On Track":sMs==="deferred"?"Deferred":"No Test",dec==="now"?"Retest Now":dec==="next"?"Defer":"",retestYear,deferDate?fmtD(deferDate):""]);
    });
  });
  const ws=XLSX.utils.aoa_to_sheet(data);
  ws["!cols"]=[{wch:20},{wch:22},{wch:30},{wch:10},{wch:35},{wch:14},{wch:14},{wch:12},{wch:14},{wch:14},{wch:10},{wch:14}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Monitoring");
  downloadXLSX(wb,"Compliance-Monitoring-"+new Date().toISOString().slice(0,10)+".xlsx");
}

(function boot(){
  try{
    if(window.__PRELOADED_GROUPS__){
      GROUPS=window.__PRELOADED_GROUPS__;
      lastSynced=window.__PRELOADED_SYNCED__||"";
      if(window.__PRELOADED_DECISIONS__){
        retestDecisions=window.__PRELOADED_DECISIONS__;
        localStorage.setItem(LS_RETEST,JSON.stringify(retestDecisions));
      }
      GROUPS.forEach(g=>{gExp[g.id]=true;g.items.forEach(i=>{iExp[i.id]=false;});});
      const ti=GROUPS.reduce((a,g)=>a+g.items.length,0);
      const ts=GROUPS.reduce((a,g)=>a+g.items.reduce((b,i)=>b+i.subs.length,0),0);
      setSyncUI("done","Compliance Dashboard",`Last synced: ${lastSynced} · ${ti} products · ${ts} test types`,100);
      renderAll();
      return;
    }
    // Otherwise load from localStorage (this browser's last live sync)
    const cached=localStorage.getItem(LS_CACHE);
    const synced=localStorage.getItem(LS_SYNCED);
    const pmmCached=localStorage.getItem("rhino_pmm_entries_v1");
    if(pmmCached){ try{ pmmEntries=JSON.parse(pmmCached)||[]; }catch(e){} }
    if(cached&&synced){
      GROUPS=JSON.parse(cached);
      lastSynced=fmtDate(synced);
      GROUPS.forEach(g=>{gExp[g.id]=true;g.items.forEach(i=>{iExp[i.id]=false;});});
      const ti=GROUPS.reduce((a,g)=>a+g.items.length,0);
      const ts=GROUPS.reduce((a,g)=>a+g.items.reduce((b,i)=>b+i.subs.length,0),0);
      // Amber "stale" state — this is cached data, not yet confirmed fresh this session.
      setSyncUI("stale","Compliance Dashboard (cached)",`Last synced: ${lastSynced} · ${ti} products · ${ts} test types — click Re-sync for the latest`,0);
      const cachedLink=document.getElementById("gate-cached-link");
      if(cachedLink) cachedLink.style.display="block";
    }
  }catch(e){ GROUPS=[]; }
  renderAll();
})();

// ── SKU lookup catalogue (separate spreadsheet: "Product Master Data Catalogue") ──
// Column positions are fixed by index rather than header text, since the sheet's
// headers have inconsistent spacing that makes exact-text matching unreliable.
// A=SKU(0) B=Parent SKU(1) D=Description(3) E=Tier(4) J=Category code(9) BY=Preferred Vendor(76)
const PMM_CATEGORY_CODE_MAP = {TD:"Tie-Down",RG:"Recovery Gear",AC:"Accessories",TO:"Towing",CA:"Camping"};

async function pmmLoadLookupCatalogue(){
  try{
    if(!pmmLookupSheetTitle){
      const metaRes=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${PMM_LOOKUP_SPREADSHEET_ID}?fields=sheets.properties`,{headers:{Authorization:"Bearer "+accessToken}});
      if(!metaRes.ok) return;
      const meta=await metaRes.json();
      const sheet0=(meta.sheets||[]).find(s=>s.properties.sheetId===0)||(meta.sheets||[])[0];
      if(!sheet0) return;
      pmmLookupSheetTitle=sheet0.properties.title;
    }
    const range=`${pmmLookupSheetTitle}!A2:BY`; // skip header row
    const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${PMM_LOOKUP_SPREADSHEET_ID}/values/${encodeURIComponent(range)}?valueRenderOption=FORMATTED_VALUE`,{headers:{Authorization:"Bearer "+accessToken}});
    if(!res.ok) return;
    const data=await res.json();
    const rows=data.values||[];
    const idx={};
    rows.forEach(row=>{
      const sku=(row[0]||"").trim().toUpperCase();
      if(!sku) return;
      const catCode=(row[9]||"").trim().toUpperCase();
      idx[sku]={
        description:row[3]||"",
        parentSku:row[1]||"",
        tier:row[4]||"",
        category:PMM_CATEGORY_CODE_MAP[catCode]||"",
        supplier:row[76]||"",
      };
    });
    pmmLookupIndex=idx;
  }catch(e){ console.warn("Lookup catalogue load failed:",e); }
}

function pmmLookupSku(){
  const sku=(pmmDraftSku||"").trim().toUpperCase();
  const status=document.getElementById("pmm-sku-lookup-status");
  if(!sku){ if(status) status.textContent=""; return; }
  const match=pmmLookupIndex[sku];
  if(match){
    if(match.description) pmmDraftDesc=match.description;
    if(match.tier) pmmDraftTier=match.tier;
    if(match.category) pmmDraftCategory=match.category;
    if(match.supplier) pmmDraftSupplier=match.supplier;
    const buckets=pmmFindSkuFamilyBuckets(sku);
    if(buckets.A.length) pmmDraftSkuFamilyA=buckets.A.join(", ");
    if(buckets.B.length) pmmDraftSkuFamilyB=buckets.B.join(", ");
    if(buckets.C.length) pmmDraftSkuFamilyC=buckets.C.join(", ");
    if(buckets.retail.length) pmmDraftRetailSku=buckets.retail.join(", ");
    pmmRenderNewEntry();
  } else if(status){
    status.textContent = Object.keys(pmmLookupIndex).length
      ? "No match found in the catalogue for this SKU — fill in manually."
      : "Catalogue not loaded yet — sync from the Compliance Dashboard tab first.";
  }
}

// Finds every SKU in the catalogue whose product description normalizes to the same
// core product family (same product, just different color/pack/dimension variants) —
// used to auto-fill "A SKU Family" with the full list of sibling SKUs.
// Groups every sibling SKU (same normalized product+size) by its Tier value from the
// catalogue: Tier A and NPD both feed "A SKU Family" (per explicit instruction), Tier B
// and C map to their own fields, and Tier "Retail" becomes its own separate bucket.
function pmmFindSkuFamilyBuckets(sku){
  const empty={A:[],B:[],C:[],retail:[]};
  const entry=pmmLookupIndex[sku];
  if(!entry || !entry.description) return empty;
  const targetName=pmmNormalizeProductName(entry.description);
  if(!targetName) return empty;
  const buckets={A:[],B:[],C:[],retail:[]};
  Object.entries(pmmLookupIndex).forEach(([s,data])=>{
    if(!data.description || pmmNormalizeProductName(data.description)!==targetName) return;
    const t=(data.tier||"").trim().toUpperCase();
    if(t==="A"||t==="NPD") buckets.A.push(s);
    else if(t==="B") buckets.B.push(s);
    else if(t==="C") buckets.C.push(s);
    else if(t==="RETAIL") buckets.retail.push(s);
    else buckets.A.push(s); // no tier on file -- default into A rather than dropping it silently
  });
  Object.values(buckets).forEach(arr=>arr.sort());
  return buckets;
}

function pmmPick(row, ...keys){
  for(const k of keys){ if(row[k]!==undefined && row[k]!=="") return row[k]; }
  return "";
}

function pmmBuildEntriesFromRows(rows){
  const byId={};
  rows.forEach((row,idx)=>{
    const entryId=pmmPick(row,"Entry ID","EntryID") || ("legacy_"+idx);
    if(!byId[entryId]){
      byId[entryId]={
        id:entryId,
        sku:pmmPick(row,"SKU"),
        skuFamily:pmmPick(row,"A SKU Family","SKU Family"),
        skuFamilyB:pmmPick(row,"B SKU Family"),
        skuFamilyC:pmmPick(row,"C SKU Family"),
        description:pmmPick(row,"Product Description"),
        category:pmmPick(row,"Category"),
        supplier:pmmPick(row,"Preferred Supplier"),
        chemCost:pmmPick(row,"Estimate Chemical Cost"),
        tier:pmmPick(row,"Tier"),
        parentSku:pmmPick(row,"Parent SKU"),
        photoUrl:pmmPick(row,"Photo URL"),
        chemTest:pmmPick(row,"Chemical Test"), chemTestCost:pmmPick(row,"Chemical Quotation","Chemical Cost"), chemTestSample:pmmPick(row,"Chemical Sample"),
        physTest:pmmPick(row,"Physical Test"), physTestCost:pmmPick(row,"Physical Quotation","Physical Cost"), physTestSample:pmmPick(row,"Physical Sample"),
        corrTest:pmmPick(row,"Corrosion Test"), corrTestCost:pmmPick(row,"Corrosion Quotation","Corrosion Cost"), corrTestSample:pmmPick(row,"Corrosion Sample"),
        testLab:pmmPick(row,"Test Lab"), quotationDate:pmmPick(row,"Quotation Date"),
        retailSku:pmmPick(row,"Retail SKU"),
        components:[],
        rowIndexes:[],
      };
    }
    if(row.__rowIndex) byId[entryId].rowIndexes.push(row.__rowIndex);
    const comp=pmmPick(row,"Component"), item=pmmPick(row,"Item"), material=pmmPick(row,"Material");
    if(comp||item||material) byId[entryId].components.push({item,component:comp,material});
  });
  return Object.values(byId).filter(e=>e.sku||e.description||e.components.length);
}

// Same as rowsToObjects, but tags each object with its absolute 1-indexed sheet row —
// needed so a delete can target the exact rows to remove.
function pmmRowsToObjectsWithIndex(rows){
  if(!rows||!rows.length) return [];
  const headers=rows[0].map(h=>String(h||"").trim());
  const out=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r];
    if(!row||!row.length) continue;
    const obj={}; let hasAny=false;
    headers.forEach((h,i)=>{
      if(!h) return;
      const v=row[i]!==undefined?String(row[i]):"";
      obj[h]=v;
      if(v) hasAny=true;
    });
    if(hasAny){ obj.__rowIndex=r+1; out.push(obj); }
  }
  return out;
}

function pmmMaterialColor(material){
  const key=(material||"").trim().toLowerCase();
  if(!key) return {bg:"#f7f8fa",text:"#999"};
  if(!pmmMaterialColors[key]){
    const idx=Object.keys(pmmMaterialColors).length % PMM_PALETTE.length;
    pmmMaterialColors[key]={bg:PMM_PALETTE[idx],text:PMM_PALETTE_TEXT[idx]};

function pmmOnPhotoSelected(file){
  if(!file) return;
  if(!accessToken){ alert('Please "Connect & Sync" with Google first (top of the Compliance Dashboard tab) before uploading a photo.'); return; }
  pmmUploadPhoto(file);
}

// Lets someone paste a copied/screenshotted image (Ctrl+V / Cmd+V) straight into the
// photo field, instead of always needing to browse for a file. Only acts while the
// Product Material Matrix "New Entry" tab is actually the visible one, and only when
// the paste ISN'T landing in a text field -- spreadsheet clipboards (Excel, Google
// Sheets) often carry a hidden image snapshot of the copied cells alongside the plain
// text, which would otherwise get mistaken for an intentional photo upload.
document.addEventListener("paste", (e)=>{
  const pmmPanelActive=document.getElementById("panel-pmm")?.classList.contains("active");
  if(!pmmPanelActive || pmmActiveTab!=="new" || pmmDraftPhotoUploading || pmmDraftPhotoUrl) return;
  const tag=(e.target?.tagName||"").toUpperCase();
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||e.target?.isContentEditable) return;
  const items=e.clipboardData?.items;
  if(!items) return;
  for(const item of items){
    if(item.type && item.type.startsWith("image/")){
      const file=item.getAsFile();
      if(file){ e.preventDefault(); pmmOnPhotoSelected(file); }
      break;
    }
  }
});

async function pmmUploadPhoto(file){
  pmmDraftPhotoUploading=true; pmmRenderNewEntry();
  try{
    const metadata={name:`pmm_${Date.now()}_${file.name}`, parents:[PMM_DRIVE_FOLDER_ID]};
    const boundary="pmm_boundary_"+Date.now();
    const base64=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result.split(",")[1]);
      reader.onerror=reject;
      reader.readAsDataURL(file);
    });
    const body=
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
      `--${boundary}\r\nContent-Type: ${file.type||"image/jpeg"}\r\nContent-Transfer-Encoding: base64\r\n\r\n${base64}\r\n`+
      `--${boundary}--`;
    const res=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink&supportsAllDrives=true",{
      method:"POST",
      headers:{Authorization:"Bearer "+accessToken,"Content-Type":`multipart/related; boundary=${boundary}`},
      body,
    });
    if(res.status===401){
      accessToken=null;
      throw new Error("Your Google session expired. Go to the Compliance Dashboard tab and click Re-sync, then try the photo again.");
    }
    if(!res.ok){ const t=await res.text(); throw new Error(`Drive upload failed (${res.status}): ${t.slice(0,150)}`); }
    const json=await res.json();
    // Make it viewable by teammates — drive.file scope only grants access to files THIS app
    // created, so without a public "anyone with the link can view" permission, only the
    // uploader's own token could ever load the image.
    await fetch(`https://www.googleapis.com/drive/v3/files/${json.id}/permissions?supportsAllDrives=true`,{
      method:"POST",
      headers:{Authorization:"Bearer "+accessToken,"Content-Type":"application/json"},
      body:JSON.stringify({role:"reader",type:"anyone"}),
    }).catch(()=>{});
    // Google's uc?export=view URL frequently fails to render inline in <img> tags
    // (redirects to an interstitial, especially for larger files). The thumbnail
    // endpoint is built for exactly this and works reliably as a direct image source.
    pmmDraftPhotoUrl=`https://drive.google.com/thumbnail?id=${json.id}&sz=w1000`;
  }catch(e){
    alert("Photo upload failed: "+e.message);
  }finally{
    pmmDraftPhotoUploading=false;
    pmmRenderNewEntry();
  }
}

function pmmImportPaste(){
  const text=(document.getElementById("pmm-import-paste")?.value||"").trim();
  if(!text){ alert("Paste some rows first."); return; }
  const rows=text.split("\n").map(l=>l.split(/\t|,/).map(x=>x.trim())).filter(r=>r.some(Boolean));
  pmmDraftComponents=rows.map((r,i)=>({item:r[0]||String(i+1),component:r[1]||"",material:r[2]||""}));
  pmmRenderNewEntry();
}

function pmmImportFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"binary"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1});
      const dataRows=rows.filter(r=>r.some(v=>v!==undefined&&v!==""));
      const startIdx=(dataRows[0]||[]).some(v=>/^(item|component|material)$/i.test(String(v).trim()))?1:0;
      pmmDraftComponents=dataRows.slice(startIdx).map((r,i)=>({item:String(r[0]??i+1),component:String(r[1]??""),material:String(r[2]??"")}));
      pmmRenderNewEntry();
    }catch(err){ alert("Could not read that file: "+err.message); }
  };
  reader.readAsBinaryString(file);
}
